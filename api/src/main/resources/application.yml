spring:
  profiles:
    include: securelocal
  # M4 spec-01 §2.2-5 / R5: 무중단 배포의 "백엔드 절반". 종료 시 진행 중(in-flight) 요청을
  # 흘려보낸 뒤 멈춰야 컷오버 구간 502 가 안 난다.
  # ⚠️ timeout-per-shutdown-phase 는 Task C(switch-backend.sh)의 `docker stop -t` 하한이다 —
  #    docker stop 기본 grace 10s 가 이 값보다 짧으면 graceful 이 SIGKILL 로 잘린다.
  #    30s 는 보수적 초기값. §9 에서 대표 엔드포인트(CTE+RDS 왕복) p99 측정 후 조정.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      # M2 spec-01 Task 1.4: 재귀 CTE 최대 깊이를 커넥션 단위로 제한.
      # 본 코드베이스 최대 사용 깊이 5 (Depth5 메서드 군), 안전 마진 + 데이터
      # 이상 시 빠른 중단 목적으로 10 고정. GLOBAL 대신 SESSION 으로 다른
      # 앱·세션에 영향 0.
      connection-init-sql: "SET SESSION cte_max_recursion_depth = 10"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# M4 spec-01: graceful shutdown 활성화 (위 spring.lifecycle.timeout-per-shutdown-phase 와 짝).
# 🟡 초록의 의미 고정 —
#   CI 가 보증하는 것  = 이 설정이 유효하고 컨텍스트가 안고 기동한다(설정 회귀 방지; ApiApplicationTests).
#   CI 가 못 하는 것    = 드레인이 실제로 502 를 막는다 → spec-01 §4 유실 grader / G4 가 배포 때 소유.
server:
  shutdown: graceful
logging:
  level:
    com.mmt: DEBUG
    org:
      springframework:
        data:
          neo4j: DEBUG
        security: DEBUG

# M1 Spec 03 Task 3.1: 피처 플래그 및 관측성 설정 (공통 기본값).
# 모든 프로파일이 상속. 프로파일별 오버라이드는 application-<profile>.yml 에서.
mmt:
  migration:
    use-mysql-cte-for-graph: false   # M2 에서 true 로 전환
    use-jpa-for-tests: false         # JPA 전환 Epic 에서 사용
    use-jpa-for-concepts: false      # JPA 전환 Epic 에서 사용
  observability:
    slow-query-threshold-ms: 100
  # M7 spec-01: 자가진단(self-report→DKT) 신규 경로 게이트 (ADR-0010).
  # false 면 신규 컨트롤러 빈 미등록 → /api/v1/diagnosis/*·/api/v1/learning-queues/* 404 — 구 동작 그대로.
  # 배포 시 프로파일에서 true 로 오버라이드. 롤백 = false 재배포.
  diagnosis:
    enabled: false
    # 진단 전용 TF Serving 클라이언트 (구 경로의 공유 RestTemplate 와 분리 — ADR-0010).
    serving-url: "http://mmt-ai:8501/v1/models/my_model:predict"
    serving-connect-timeout-ms: 2000
    serving-read-timeout-ms: 5000
    # 익명 preview IP 단위 분당 상한 (§4.6 남용 방어 — TF Serving 실호출 경로만)
    preview-rate-limit-per-minute: 10
