spring:
  profiles:
    include: securelocal
  # M4 spec-01 §2.2-5 / R5: 무중단 배포의 "백엔드 절반". 종료 시 진행 중(in-flight) 요청을
  # 흘려보낸 뒤 멈춰야 컷오버 구간 502 가 안 난다.
  # ⚠️ timeout-per-shutdown-phase 는 Task C(switch-backend.sh)의 `docker stop -t` 하한이다 —
  #    docker stop 기본 grace 10s 가 이 값보다 짧으면 graceful 이 SIGKILL 로 잘린다.
  #    30s 는 보수적 초기값. §9 에서 대표 엔드포인트(CTE+RDS 왕복) p99 측정 후 조정.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      # M2 spec-01 Task 1.4: 재귀 CTE 최대 깊이를 커넥션 단위로 제한.
      # 본 코드베이스 최대 사용 깊이 5 (Depth5 메서드 군), 안전 마진 + 데이터
      # 이상 시 빠른 중단 목적으로 10 고정. GLOBAL 대신 SESSION 으로 다른
      # 앱·세션에 영향 0.
      connection-init-sql: "SET SESSION cte_max_recursion_depth = 10"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# M4 spec-01: graceful shutdown 활성화 (위 spring.lifecycle.timeout-per-shutdown-phase 와 짝).
# 🟡 초록의 의미 고정 —
#   CI 가 보증하는 것  = 이 설정이 유효하고 컨텍스트가 안고 기동한다(설정 회귀 방지; ApiApplicationTests).
#   CI 가 못 하는 것    = 드레인이 실제로 502 를 막는다 → spec-01 §4 유실 grader / G4 가 배포 때 소유.
server:
  shutdown: graceful
logging:
  level:
    com.mmt: DEBUG
    org:
      springframework:
        data:
          neo4j: DEBUG
        security: DEBUG

# M1 Spec 03 Task 3.1: 피처 플래그 및 관측성 설정 (공통 기본값).
# 모든 프로파일이 상속. 프로파일별 오버라이드는 application-<profile>.yml 에서.
mmt:
  migration:
    use-mysql-cte-for-graph: false   # M2 에서 true 로 전환
    use-jpa-for-tests: false         # JPA 전환 Epic 에서 사용
    use-jpa-for-concepts: false      # JPA 전환 Epic 에서 사용
  observability:
    slow-query-threshold-ms: 100
  # M7 spec-01: 자가진단(self-report→DKT) 신규 경로 게이트 (ADR-0010).
  # false 면 신규 컨트롤러 빈 미등록 → /api/v1/diagnosis/*·/api/v1/learning-queues/* 404 — 구 동작 그대로.
  # 배포 시 프로파일에서 true 로 오버라이드. 롤백 = false 재배포.
  diagnosis:
    enabled: false
    # 진단 전용 TF Serving 클라이언트 (구 경로의 공유 RestTemplate 와 분리 — ADR-0010).
    serving-url: "http://mmt-ai:8501/v1/models/my_model:predict"
    serving-connect-timeout-ms: 2000
    serving-read-timeout-ms: 5000
    # 익명 preview IP 단위 분당 상한 (§4.6 남용 방어 — TF Serving 실호출 경로만)
    preview-rate-limit-per-minute: 10

# ─────────────────────────────────────────────────────────────────────────────
# 프로덕션(secure) 배선 — placeholder-only. (ADR-0013, docs/backlog/ci-backend-image-missing-secure-yml.md)
#
# 왜 여기 있나: 유출 대응(c7f608d)이 시크릿-보유 application-secure.yml 을 추적 해제·
# gitignore 하면서 그 안의 "비밀 아닌 env 매핑 구조"까지 사라졌다. 그 이후 CI 가 빌드한
# 백엔드 이미지는 이 배선이 없어 프로덕션에서 DataSource 미구성으로 부팅 실패했다.
# → 배선(값 아님)만 tracked 로 복구한다. 실제 값은 계속 호스트 env-file(RDS_*·REDIS_*·
# GOOGLE_*·JWT_SECRET·EC2_DOMAIN_*)에서만 주입 — 이 문서에는 ${ENV} placeholder 만, 리터럴 0.
#
# 왜 profile-gated(secure)인가: `spring.config.activate.on-profile: secure` 로 게이트해
# 프로덕션(active=secure)에서만 로드된다. 로컬 dev(securelocal)·테스트(test)는 secure 미활성이라
# 이 문서를 안 읽고, 각자 application-securelocal.yml / TestcontainersConfig 로 배선한다.
# 옛 application-secure.yml(blob 10ecb485, c7f608d^)이 하던 일을 tracked·무영향으로 정확히 복원.
# ─────────────────────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: secure
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDS_HOST}:${RDS_PORT}/${RDS_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  redis:
    host: ${REDIS_URL:localhost}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  neo4j:
    uri: bolt://${GDB_URL:localhost}:${GDB_PORT}
    authentication:
      username: ${GDB_USERNAME}
      password:  ${GDB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: https://www.my-math-teacher.com/login/oauth2/code/google
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            redirect-uri: https://www.my-math-teacher.com/login/oauth2/code/naver
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            redirect-uri: https://www.my-math-teacher.com/login/oauth2/code/kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  # (#7) 운영 프로파일에서 SQL 로깅 비활성화 — base application.yml 의 show_sql:true 를 오버라이드.
  jpa:
    show-sql: false
    properties:
      hibernate:
        show_sql: false
jwt:
  header: Authorization
  secret: ${JWT_SECRET}
  # 1시간 / 2시간
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 7200
allowed:
  # origins: http://${EC2_IP}
  origins1: https://${EC2_DOMAIN_NAME1}
  origins2: https://${EC2_DOMAIN_NAME2}

# (#7) 운영 로깅 레벨 — base application.yml 의 DEBUG(com.mmt / security / data.neo4j) 를 오버라이드.
# 토큰·인증·SQL 상세가 운영 로그로 새지 않도록 INFO/WARN 으로 낮춘다.
# 로컬 dev 는 base + securelocal 의 DEBUG 를 그대로 유지(이 문서는 secure 프로파일에서만 로드).
logging:
  level:
    com.mmt: INFO
    org.springframework.security: INFO
    org.springframework.data.neo4j: INFO
    org.hibernate.SQL: WARN
