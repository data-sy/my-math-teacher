# 테스트 전용 프로파일 뼈대. securelocal과 독립적이며 인클루드 관계 없음.
# 활성화: @ActiveProfiles("test") 또는 -Dspring.profiles.active=test
# 이 파일은 Spec 03 Task 3.1에서 mmt.* 설정과 benchmark baseline이 추가되어 확장됨.

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 JVM 기동마다 엔티티 기반 스키마 자동 생성
    properties:
      hibernate:
        generate_statistics: true   # Task 1.4의 N+1 테스트가 이 설정에 의존
        format_sql: true
    show-sql: false  # 로그는 logging.level로 제어

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE  # Hibernate 6.x (Spring Boot 3.x)
    org.springframework.data.neo4j.cypher: DEBUG

# M1 Spec 03 Task 3.1: Spec 02 Task 2.2 실측 기준선 주입.
# 현재는 참조용 (회귀 테스트는 각 테스트 클래스의 BASELINE_* 상수 하드코딩 사용).
# 후속 작업에서 @Value("${mmt.benchmark.baseline.*}") 로 주입 전환 예정.
mmt:
  benchmark:
    baseline:
      find-results-ms: 3         # RepositoryBenchmarkTest 실측 avg 1.495ms → ceiling 버퍼 3ms
      depth3-traversal-ms: 6     # GraphQueryPerformanceTest 실측 avg 5.392ms → ceiling 버퍼 6ms

---
# ─────────────────────────────────────────────────────────────────────────────
# CI 이식성 — test 프로파일 자기완결 배선 (원인 A 해소)
# 정본: docs/backlog/test-suite-not-portable-to-ci.md
#
# 왜 필요한가: 종전에는 base application.yml 의 `spring.profiles.include: securelocal` 이
# 무조건 걸려 test 프로파일에서도 application-securelocal.yml 이 아래 값들을 채워줬다.
# 그런데 그 파일은 gitignore 라 CI 에 없다 → include 가 no-op → ${...} 미해결로 컨텍스트 실패.
# include 를 default 로 바꿨으므로(base 상단 주석 참조) test 프로파일이 스스로 채운다.
#
# ⚠️ 여기 값은 전부 **테스트 전용 더미**다. 실 시크릿이 아니며 어떤 실환경도 가리키지 않는다.
#     DB/Neo4j 는 여기 없다 — Testcontainers(@ServiceConnection)가 런타임에 주입한다.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  # CI 는 워크플로의 redis:7-alpine 서비스 컨테이너(무인증). 로컬 redis 에 requirepass 가
  # 걸려 있으면 TEST_REDIS_PASSWORD 로 넘긴다 — 기본값 공란은 "인증 없음"으로 해석된다.
  redis:
    host: ${TEST_REDIS_HOST:localhost}
    port: ${TEST_REDIS_PORT:6379}
    password: ${TEST_REDIS_PASSWORD:}
  # SecurityConfig 의 .oauth2Login() 은 ClientRegistrationRepository 빈을 요구한다.
  # 등록이 하나도 없으면 그 빈이 생성되지 않아 필터체인 빌드에서 컨텍스트가 죽는다.
  # → 형태만 갖춘 더미 등록. 테스트는 OAuth 왕복을 실제로 하지 않는다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            client-name: Naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# TokenProvider 가 Base64 디코드 후 HS256 키로 쓴다(디코드 결과 32바이트 이상 필요).
# 아래는 평문 "mmt-ci-test-profile-dummy-key-not-a-real-secret-0123456789abcdef"(64B)의 Base64 —
# 값 자체가 더미임을 문자열로 드러내 두었다. 실 시크릿 아님.
jwt:
  header: Authorization
  secret: bW10LWNpLXRlc3QtcHJvZmlsZS1kdW1teS1rZXktbm90LWEtcmVhbC1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZg==
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 7200

# WebConfig 의 CORS 화이트리스트 (@Value 라 미해결 시 컨텍스트 실패)
allowed:
  origins1: http://localhost:8080
  origins2: http://localhost:8080
