# 활성 백엔드 upstream fragment (M4 spec-01 §3.2).
#
# web/nginx.conf 의 `upstream mmt_backend { include /etc/nginx/active-backend.conf; }`
# 가 이 파일을 읽는다. 프론트(=nginx) 컨테이너에 다음과 같이 마운트한다:
#   ./deploy/active-backend.conf : /etc/nginx/active-backend.conf  (conf.d 밖 — 이중 include 방지)
#
# 배포 시 deploy/switch-backend.sh (Task C) 가 이 한 줄을 blue/green 으로 재작성한 뒤
# `docker exec mmt-front nginx -s reload` 로 무중단 전환한다. 아래는 최초 활성 색(blue) 기본값.
server mmt-backend-blue:8080;
