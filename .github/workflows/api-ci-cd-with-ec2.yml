name: Backend CI CD with EC2

on:
  # M2 검증 완료 시점에 자동 트리거를 제거 — 포트폴리오 컨텍스트로 EC2 배포는
  # 실제로 수행되지 않으므로 main push 마다 deploy job 이 도는 노이즈를 차단.
  # 필요 시 GitHub UI 의 "Run workflow" 버튼으로 수동 실행 가능.
  workflow_dispatch:
    inputs:
      # M4 spec-01 §4: 임시 게이트 우회. 이 워크플로는 M2 이후 dormant 였고
      # ./gradlew test 전수가 CI 에서 처음 도는데, 선재 테스트/CI 비호환
      # (test 프로파일 placeholder·ApiApplicationTests·perf flaky)로 첫 배포가 막힌다.
      # 무중단 배포 §4 측정을 먼저 끝내기 위해 test 게이트만 한시적으로 스킵한다.
      # ⚠️ 측정·destroy 후 되돌린다(이 input + 아래 if 가드 제거). test 의 CI-호환은 후속.
      skip_tests:
        description: 'Skip the test gate (M4 §4 measurement bypass — revert after)'
        type: boolean
        default: false
      # 테스트 게이트만 돌리고 배포는 안 나가게 하는 스위치. 원인 C(러너 자원)를 고치는 동안
      # CI 신호를 반복해서 봐야 하는데, 이 워크플로는 test 가 초록이면 build→deploy 까지
      # 이어져 프로덕션 blue-green 전환이 딸려 나온다. 정본: docs/backlog/test-suite-not-portable-to-ci.md
      # skip_tests 와 함께 켜면 아무 job 도 돌지 않는다(의미 없는 조합).
      tests_only:
        description: 'Run the test gate only (no build/deploy)'
        type: boolean
        default: false

jobs:
  test:
    # skip_tests=false(기본)면 게이트 정상 작동 — 실패 시 아래 build 가 스킵된다.
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    # 러너가 죽을 때까지 매달리지 않게 상한을 둔다. 2026-08-15 run 31879698138 은
    # Redis 부재로 57분간 행 → 로그 업로드도 못 하고 실패해 원인 파악이 어려웠다.
    # 전 스위트 로컬 실측이 4분대이므로 20분이면 정상 실행엔 충분하다.
    timeout-minutes: 20
    # MySQL·Neo4j 는 각 테스트가 Testcontainers 로 직접 띄우지만 Redis 는 그렇지 않다.
    # RedisUtilTest·ConceptServiceCacheTest 등 8개가 로컬 localhost:6379 를 그냥 쓴다
    # (자체 GenericContainer 를 띄우는 건 RedisCrossInstanceSerializerTest·
    #  RefreshTokenRotationIntegrationTest 2개뿐). 로컬에선 mmt-redis 가 그 자리에 있어
    # 통과하지만 러너엔 없어서 Lettuce 가 무한정 매달린다 — 그래서 이 스위트는 지금껏
    # CI 에서 돈 적이 없고 skip_tests 우회가 상수처럼 쓰였다.
    #
    # test 프로파일은 비밀번호 없는 기본값(localhost:6379)을 기대한다:
    # application.yml 의 redis 설정은 `on-profile: secure` 문서 안이라 테스트에서 미로드이고,
    # `include: securelocal` 은 CI 에 그 파일이 없어(gitignore) no-op 이다.
    # → 인증 없는 평범한 redis 로 충분. 근본 해법(Testcontainers Redis @ServiceConnection)은
    #   Spring Boot 3.2+ 의존이라 백로그.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run tests
        working-directory: ./api
        run: ./gradlew test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/build/reports/tests/test

  build-and-push:
    needs: test
    # test 가 성공했거나(게이트 통과) skip_tests 로 스킵됐을 때만 진행.
    # test 가 실제로 실패하면(result==failure) 여기서 멈춰 게이트가 유지된다.
    # tests_only 면 초록이어도 여기서 멈춘다 — deploy 는 이 job 을 needs 하므로 함께 스킵된다.
    if: ${{ always() && !inputs.tests_only && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    # 가장 최신의 Ubuntu 러너를 사용합니다.

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
      # 현재 리포지토리를 체크아웃합니다.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1  
      # Docker Buildx를 설정합니다.

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  
        # GitHub Secret에서 Docker Hub 사용자 이름을 가져옵니다.
        password: ${{ secrets.DOCKERHUB_TOKEN }}     
        # GitHub Secret에서 Docker Hub 액세스 토큰을 가져옵니다.

    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        context: ./api  
        # Dockerfile이 있는 위치입니다.
        file: ./api/Dockerfile  
        # Dockerfile의 경로입니다.
        push: true  
        # 이미지를 레지스트리에 푸시합니다.
        # M4 spec-01 §3.5: 가변 태그(:1.0.0, 매 빌드 덮어쓰기) → immutable git sha.
        # blue-green 의 신·구 버전 구분과 sha 단위 롤백의 전제(§1.1·§2.2-1).
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mmt-backend:${{ github.sha }}
        platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    # build-and-push 가 (스킵/실패로) 안 돌면 배포도 스킵. always() 는 build 의
    # if-가드가 up-stream 스킵을 전파해도 result 를 명시적으로 확인하기 위함.
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest

    # ADR 0008: SSH-from-runner → SSM Run Command. OIDC 로 단기 AWS 자격을 얻어
    # (장기 키 0) ssm:SendCommand 로 EC2 의 switch-backend.sh 를 트리거한다.
    permissions:
      id-token: write   # OIDC 토큰 발급(configure-aws-credentials 가 assume-role 에 사용)
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mmt-backend
      # 비밀 아님 — front 와 백엔드가 공유하는 compose user-defined 네트워크명(R3).
      # 미설정 시 compose 프로젝트 기본값(앱 디렉토리=ec2-user → ec2-user_default).
      COMPOSE_NET: ${{ vars.COMPOSE_NET || 'ec2-user_default' }}
      # 비밀 아님 — nginx 가 실제 마운트하는 fragment 의 호스트 경로. switch-backend.sh 기본값은
      # $SCRIPT_DIR/active-backend.conf(=~/deploy/active-backend.conf)이나, 현 프로덕션 호스트의
      # nginx 는 ~/active-backend.conf 를 마운트한다 → 명시 전달로 정합(백로그 §함께처리).
      FRAGMENT_HOST_FILE: ${{ vars.FRAGMENT_HOST_FILE || '/home/ec2-user/active-backend.conf' }}
      # §4 측정: t3.micro(1 vCPU)에서 부팅 JVM 이 코어를 독점(148%)해 서빙 JVM 을 굶겨
      # 컷오버 창에서 요청 타임아웃 발생(최대 11.4%, 502 아님·전송갭 아님·순수 CPU 경합).
      # 부팅 컨테이너를 반 코어로 캡하면 완전 무중단 0% 확증(§4 3단 결론). switch-backend.sh
      # 가 --cpus 로 소비. vars.CPU_LIMIT 로 튜닝 가능(0.6/0.75 재측정), 빈 값이면 무제한.
      CPU_LIMIT: ${{ vars.CPU_LIMIT || '0.5' }}
      NEW_TAG: ${{ github.sha }}

    steps:
    # OIDC → mmt-ci-deploy-role(terraform iam.tf) assume. 단기 자격만 셸에 주입.
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    # M4 spec-01 §3.5: 기존 다운타임 시퀀스(rm -f → rmi → compose up → prune,
    # 유일 백엔드를 먼저 죽여 502 발생 — §1.1·§1.2) 제거. 대신 EC2 의
    # deploy/switch-backend.sh(Task C)를 immutable sha 로 호출해 blue-green 무중단 전환.
    # 구버전 정리는 스크립트가 graceful 드레인(docker stop -t ≥30s)으로 수행하므로
    # 여기서 rm/rmi/prune 안 한다 — 이전 sha 이미지는 롤백용으로 보존(§2.2·§4.4).
    - name: EC2 blue-green switch via SSM
      shell: bash
      run: |
        set -euo pipefail

        # ── 원격 명령 조립 ────────────────────────────────────────────────
        # SSM 명령은 기본 root 로 실행되나 switch-backend.sh 는 ec2-user 홈의
        # 파일·상대경로·docker 그룹에 의존(ADR 0008 D1) → runuser 로 ec2-user
        # 정체성·작업디렉토리·그룹을 그대로 태워 실행한다.
        # IMAGE_REPO/COMPOSE_NET/FRAGMENT_HOST_FILE/CPU_LIMIT/NEW_TAG 는 비밀 아닌 배포 토글(공백 없음)이라 인라인.
        REMOTE="cd ~ && IMAGE_REPO=${IMAGE_REPO} COMPOSE_NET=${COMPOSE_NET} FRAGMENT_HOST_FILE=${FRAGMENT_HOST_FILE} CPU_LIMIT=${CPU_LIMIT} NEW_TAG=${NEW_TAG} bash deploy/switch-backend.sh ${NEW_TAG}"
        FULL="runuser -l ec2-user -c '${REMOTE}'"
        PARAMS=$(jq -nc --arg c "$FULL" '{commands: [$c]}')

        # ── send-command (Project=mmt 태그 타겟 — 인스턴스 ID 조회 불필요) ──
        CMD_ID=$(aws ssm send-command \
          --document-name AWS-RunShellScript \
          --comment "M4 blue-green deploy ${NEW_TAG}" \
          --targets "Key=tag:Project,Values=mmt" \
          --parameters "$PARAMS" \
          --query 'Command.CommandId' --output text)
        echo "SSM CommandId=$CMD_ID"

        # ── 실행된 인스턴스 ID 해석(get-command-invocation 에 필요) ────────
        # 태그 타겟이라 매칭 인스턴스가 0개여도 send-command 는 CommandId 를 돌려준다
        # → invocation 이 생길 때까지 폴링해야 "대상 없음"과 "아직 등록 전"이 갈린다.
        # ⚠️ 재런치(terraform apply) 직후엔 새 인스턴스의 SSM 에이전트 등록에 수 분이 걸린다.
        #    2026-08-05 run 30972873738 이 이 대기(구 30초)를 넘겨 실패했다 → 2분으로 상향.
        IID=""
        for _ in $(seq 1 60); do
          IID=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
                  --query 'CommandInvocations[0].InstanceId' --output text 2>/dev/null || true)
          [ -n "$IID" ] && [ "$IID" != "None" ] && break
          sleep 2
        done
        if [ -z "$IID" ] || [ "$IID" = "None" ]; then
          echo "::error::SSM 이 2분 안에 대상 인스턴스를 찾지 못함 (CommandId=$CMD_ID)"
          # 이 job 의 IAM 역할은 SendCommand/GetCommandInvocation/ListCommandInvocations 만
          # 갖는다(iam.tf ci_deploy_perms) — ec2:DescribeInstances·ssm:DescribeInstanceInformation
          # 이 없어 여기서 원인을 자동 판별할 수 없다. 사람이 가를 수 있게 명령을 남긴다.
          echo "원인 후보 3가지 — 맥에서 아래로 가른다:"
          echo "  1) 인스턴스 부재/정지:"
          echo "     aws ec2 describe-instances --profile mmt-admin --region ap-northeast-2 \\"
          echo "       --filters Name=tag:Project,Values=mmt Name=instance-state-name,Values=running"
          echo "  2) Project=mmt 태그 누락: 위 출력이 비면 태그 문제 (terraform compute.tf 가 붙인다)"
          echo "  3) SSM 에이전트 미등록(재런치 직후 흔함):"
          echo "     aws ssm describe-instance-information --profile mmt-admin --region ap-northeast-2"
          echo "     → 인스턴스가 목록에 뜰 때까지 기다렸다가 이 워크플로를 재실행"
          exit 1
        fi
        echo "Target instance=$IID"

        # ── 상태 폴링(비동기 → 안 기다리면 항상 green 오탐) ────────────────
        # switch-backend.sh 는 헬스 폴(~150s) + graceful 드레인(30s)까지 → 넉넉히.
        STATUS="Pending"
        for _ in $(seq 1 120); do   # 최대 ~10분
          STATUS=$(aws ssm get-command-invocation \
                     --command-id "$CMD_ID" --instance-id "$IID" \
                     --query 'Status' --output text)
          case "$STATUS" in
            Success) break ;;
            Pending|InProgress|Delayed) sleep 5 ;;
            *) break ;;
          esac
        done

        # ── 결과 회수(stdout/stderr) + 성패 판정 ──────────────────────────
        echo "===== switch-backend.sh stdout ====="
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
          --query 'StandardOutputContent' --output text || true
        echo "===== switch-backend.sh stderr ====="
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
          --query 'StandardErrorContent' --output text || true

        if [ "$STATUS" != "Success" ]; then
          echo "::error::SSM 배포 실패 — Status=$STATUS"
          exit 1
        fi
        echo "SSM 배포 성공 (Status=Success)"
