name: Backend CI CD with EC2

on:
  # M2 검증 완료 시점에 자동 트리거를 제거 — 포트폴리오 컨텍스트로 EC2 배포는
  # 실제로 수행되지 않으므로 main push 마다 deploy job 이 도는 노이즈를 차단.
  # 필요 시 GitHub UI 의 "Run workflow" 버튼으로 수동 실행 가능.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run tests
        working-directory: ./api
        run: ./gradlew test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # 가장 최신의 Ubuntu 러너를 사용합니다.

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
      # 현재 리포지토리를 체크아웃합니다.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1  
      # Docker Buildx를 설정합니다.

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  
        # GitHub Secret에서 Docker Hub 사용자 이름을 가져옵니다.
        password: ${{ secrets.DOCKERHUB_TOKEN }}     
        # GitHub Secret에서 Docker Hub 액세스 토큰을 가져옵니다.

    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        context: ./api  
        # Dockerfile이 있는 위치입니다.
        file: ./api/Dockerfile  
        # Dockerfile의 경로입니다.
        push: true  
        # 이미지를 레지스트리에 푸시합니다.
        # M4 spec-01 §3.5: 가변 태그(:1.0.0, 매 빌드 덮어쓰기) → immutable git sha.
        # blue-green 의 신·구 버전 구분과 sha 단위 롤백의 전제(§1.1·§2.2-1).
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mmt-backend:${{ github.sha }}
        platforms: linux/amd64,linux/arm64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    # M4 spec-01 §3.5: 기존 다운타임 시퀀스(rm -f → rmi → compose up → prune,
    # 유일 백엔드를 먼저 죽여 502 발생 — §1.1·§1.2) 제거. 대신 EC2 의
    # deploy/switch-backend.sh(Task C)를 immutable sha 로 호출해 blue-green 무중단 전환.
    # 구버전 정리는 스크립트가 graceful 드레인(docker stop -t ≥30s)으로 수행하므로
    # 여기서 rm/rmi/prune 안 한다 — 이전 sha 이미지는 롤백용으로 보존(§2.2·§4.4).
    - name: EC2 blue-green switch
      uses: appleboy/ssh-action@master
      env:
        IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/mmt-backend
        # 비밀 아님 — front 와 백엔드가 공유하는 compose user-defined 네트워크명(R3).
        # 미설정 시 compose 프로젝트 기본값(앱 디렉토리=ec2-user → ec2-user_default).
        COMPOSE_NET: ${{ vars.COMPOSE_NET || 'ec2-user_default' }}
        NEW_TAG: ${{ github.sha }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        # spec-01 §9.2: 키페어(key) 인증. EC2(AL2023)는 비밀번호 SSH 기본 비활성 →
        # GH Secret EC2_SSH_KEY 에 private key(~/.ssh/mmt-ec2) 파일째 주입.
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        # IMAGE_REPO/COMPOSE_NET/NEW_TAG 를 원격 셸로 전달(switch-backend.sh 가 읽음).
        envs: IMAGE_REPO,COMPOSE_NET,NEW_TAG
        # 원격 기본 작업 디렉토리=홈(~). 앱 디렉토리에 docker-compose.yml + deploy/ 배치(§9.6 step4-5).
        script: |
          bash deploy/switch-backend.sh "$NEW_TAG"
