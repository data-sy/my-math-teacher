# 무중단 배포(blue-green) 전환 지점 (M4 spec-01 §3.2).
# upstream 멤버(server 지시어)는 conf.d 밖의 fragment 한 곳에만 두고,
# 배포 스크립트(deploy/switch-backend.sh, Task C)가 이 fragment 만 재작성 + `nginx -s reload`.
#   ⚠️ include 경로를 /etc/nginx/conf.d/ 안에 두면 안 된다 — 스톡 nginx 메인 설정의
#      `include /etc/nginx/conf.d/*.conf` 가 같은 파일을 http 컨텍스트에서 한 번 더 로드해
#      "server mmt-backend-...:8080;" 가 standalone 으로 파싱되며 `nginx -t` 가 깨진다.
#      그래서 fragment 는 conf.d 밖(/etc/nginx/active-backend.conf)에 마운트한다.
upstream mmt_backend {
    include /etc/nginx/active-backend.conf;
}

server {
    listen       80;
    server_name  _;

    # 프록시 공통 헤더 — proxy_pass 가 upstream 이름(mmt_backend)을 Host 로 흘려보내면
    # Tomcat 10.1 이 언더스코어를 invalid domain 으로 보고 400(HttpParser). 원래 Host 를 보존한다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 세 location 모두 동일 upstream 을 바라보도록 통일 (구버전은 /oauth2·/login/oauth2 가
    # ec2-user-mmt-backend-1 로 갈려 있었음 — spec-01 §1.3·R7).
    location /api/v1/ {
        proxy_pass http://mmt_backend;
    }

    location /oauth2/ {
        proxy_pass http://mmt_backend;
    }

    location /login/oauth2 {
        proxy_pass http://mmt_backend;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
