# 무중단 배포(blue-green) 전환 지점 (M4 spec-01 §3.2).
# upstream 멤버(server 지시어)는 conf.d 밖의 fragment 한 곳에만 두고,
# 배포 스크립트(deploy/switch-backend.sh, Task C)가 이 fragment 만 재작성 + `nginx -s reload`.
#   ⚠️ include 경로를 /etc/nginx/conf.d/ 안에 두면 안 된다 — 스톡 nginx 메인 설정의
#      `include /etc/nginx/conf.d/*.conf` 가 같은 파일을 http 컨텍스트에서 한 번 더 로드해
#      "server mmt-backend-...:8080;" 가 standalone 으로 파싱되며 `nginx -t` 가 깨진다.
#      그래서 fragment 는 conf.d 밖(/etc/nginx/active-backend.conf)에 마운트한다.
upstream mmt_backend {
    include /etc/nginx/active-backend.conf;
}

# --- 80: Let's Encrypt 챌린지 서빙 + 나머지는 443 리다이렉트 (M6 spec-01 D2, R5) ---
# ⚠️ 배포 순서 전제: 이 config 를 적용하기 전에 인증서를 먼저 발급한다
#    (certbot certonly --webroot -w /var/www/certbot -d www.my-math-teacher.com).
#    아래 443 server 가 존재하지 않는 인증서 파일을 참조하면 `nginx -t` 가 깨지기 때문.
#    갱신(90일)은 아래 acme-challenge location 이 80 에서 살아있어야 성공한다.
server {
    listen       80;
    server_name  _;

    # HTTP-01 갱신 경로는 리다이렉트 예외 — 80 에서 그대로 서빙(certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 https 로. $host 보존 → www/apex 무관 동작.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443: TLS 종단 + blue-green 백엔드 프록시 + 정적 SPA (M6 spec-01) ---
server {
    listen       443 ssl;
    server_name  _;

    # certbot 발급 인증서(www.my-math-teacher.com lineage). 90일 자동갱신(R5).
    ssl_certificate     /etc/letsencrypt/live/www.my-math-teacher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.my-math-teacher.com/privkey.pem;
    # certbot 관리 include 파일에 의존하지 않도록 최소 파라미터를 인라인(hand-managed config).
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 프록시 공통 헤더 — proxy_pass 가 upstream 이름(mmt_backend)을 Host 로 흘려보내면
    # Tomcat 10.1 이 언더스코어를 invalid domain 으로 보고 400(HttpParser). 원래 Host 를 보존한다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 세 location 모두 동일 upstream 을 바라보도록 통일 (구버전은 /oauth2·/login/oauth2 가
    # ec2-user-mmt-backend-1 로 갈려 있었음 — spec-01 §1.3·R7).
    location /api/v1/ {
        proxy_pass http://mmt_backend;
    }

    location /oauth2/ {
        proxy_pass http://mmt_backend;
    }

    location /login/oauth2 {
        proxy_pass http://mmt_backend;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
